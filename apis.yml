aid: unisson
name: Unisson
description: >-
  Unisson (YC W26) builds AI agents that act as subject-matter experts for B2B
  software implementation and customer-facing teams. Its Runner agent executes
  complex deployment, onboarding, and administration tasks directly inside a
  product, while Explorer maintains an always up-to-date knowledge base of how
  the product works. Agents are reachable over Slack, Microsoft Teams,
  WhatsApp, email, and an embeddable widget, and the platform exposes a
  bearer-token REST API (api.unisson.ai) covering agents, runs, scheduled
  runs, skills, knowledge base, integrations, customers, meetings, and an
  external Runner API for triggering runs and receiving webhook callbacks
  from your own tools.
