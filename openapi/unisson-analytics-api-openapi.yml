openapi: 3.1.0
info:
  title: Unisson agent-evals analytics API
  version: 1.0.0
tags:
- name: analytics
paths:
  /api/v1/analytics/overview:
    get:
      tags:
      - analytics
      summary: Get Analytics Overview
      description: Get comprehensive analytics for the organization.
      operationId: get_analytics_overview_api_v1_analytics_overview_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverviewResponse'
      security:
      - HTTPBearer: []
components:
  schemas:
    SourceCount:
      properties:
        source:
          type: string
          title: Source
        count:
          type: integer
          title: Count
      type: object
      required:
      - source
      - count
      title: SourceCount
    TaskAnalyticsData:
      properties:
        total_tasks:
          type: integer
          title: Total Tasks
        open_tasks:
          type: integer
          title: Open Tasks
        resolved_tasks:
          type: integer
          title: Resolved Tasks
        resolved_by_agents:
          type: integer
          title: Resolved By Agents
        resolution_rate:
          type: number
          title: Resolution Rate
        avg_resolution_hours:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Resolution Hours
        by_status:
          items:
            $ref: '#/components/schemas/StatusCount'
          type: array
          title: By Status
        by_severity:
          items:
            $ref: '#/components/schemas/SeverityCount'
          type: array
          title: By Severity
        monthly_trend:
          items:
            $ref: '#/components/schemas/MonthlyCount'
          type: array
          title: Monthly Trend
      type: object
      required:
      - total_tasks
      - open_tasks
      - resolved_tasks
      - resolved_by_agents
      - resolution_rate
      - avg_resolution_hours
      - by_status
      - by_severity
      - monthly_trend
      title: TaskAnalyticsData
    AnalyticsOverviewResponse:
      properties:
        total_tasks_completed:
          type: integer
          title: Total Tasks Completed
        total_hours_saved:
          type: number
          title: Total Hours Saved
        total_clicks_automated:
          type: integer
          title: Total Clicks Automated
        total_workflows_learned:
          type: integer
          title: Total Workflows Learned
        task_leaderboard:
          items:
            $ref: '#/components/schemas/UserTaskStats'
          type: array
          title: Task Leaderboard
        tasks_monthly_trend:
          items:
            $ref: '#/components/schemas/MonthlyCount'
          type: array
          title: Tasks Monthly Trend
        task_success_rate:
          type: number
          title: Task Success Rate
        tasks_by_source:
          items:
            $ref: '#/components/schemas/SourceCount'
          type: array
          title: Tasks By Source
        avg_task_duration_seconds:
          type: number
          title: Avg Task Duration Seconds
        tasks:
          $ref: '#/components/schemas/TaskAnalyticsData'
        top_workflows:
          items:
            $ref: '#/components/schemas/WorkflowStats'
          type: array
          title: Top Workflows
        top_agents:
          items:
            $ref: '#/components/schemas/AgentStats'
          type: array
          title: Top Agents
          default: []
        kb:
          $ref: '#/components/schemas/KBStats'
      type: object
      required:
      - total_tasks_completed
      - total_hours_saved
      - total_clicks_automated
      - total_workflows_learned
      - task_leaderboard
      - tasks_monthly_trend
      - task_success_rate
      - tasks_by_source
      - avg_task_duration_seconds
      - tasks
      - top_workflows
      - kb
      title: AnalyticsOverviewResponse
    UserTaskStats:
      properties:
        user_id:
          type: string
          title: User Id
        user_name:
          type: string
          title: User Name
        email:
          type: string
          title: Email
        tasks_completed:
          type: integer
          title: Tasks Completed
        hours_saved:
          type: number
          title: Hours Saved
        clicks_automated:
          type: integer
          title: Clicks Automated
      type: object
      required:
      - user_id
      - user_name
      - email
      - tasks_completed
      - hours_saved
      - clicks_automated
      title: UserTaskStats
    KBStats:
      properties:
        total_features:
          type: integer
          title: Total Features
        total_workflows:
          type: integer
          title: Total Workflows
        total_company_knowledge:
          type: integer
          title: Total Company Knowledge
        total_draft_workflows:
          type: integer
          title: Total Draft Workflows
        auto_discovered_features:
          type: integer
          title: Auto Discovered Features
        auto_discovered_workflows:
          type: integer
          title: Auto Discovered Workflows
        manually_added_company_knowledge:
          type: integer
          title: Manually Added Company Knowledge
        manually_added_draft_workflows:
          type: integer
          title: Manually Added Draft Workflows
        edits_applied:
          type: integer
          title: Edits Applied
        total_kb_updates:
          type: integer
          title: Total Kb Updates
        kb_leaderboard:
          items:
            $ref: '#/components/schemas/UserKBStats'
          type: array
          title: Kb Leaderboard
      type: object
      required:
      - total_features
      - total_workflows
      - total_company_knowledge
      - total_draft_workflows
      - auto_discovered_features
      - auto_discovered_workflows
      - manually_added_company_knowledge
      - manually_added_draft_workflows
      - edits_applied
      - total_kb_updates
      - kb_leaderboard
      title: KBStats
    SeverityCount:
      properties:
        severity:
          type: string
          title: Severity
        count:
          type: integer
          title: Count
      type: object
      required:
      - severity
      - count
      title: SeverityCount
    StatusCount:
      properties:
        status:
          type: string
          title: Status
        count:
          type: integer
          title: Count
      type: object
      required:
      - status
      - count
      title: StatusCount
    AgentStats:
      properties:
        agent_id:
          type: string
          title: Agent Id
        agent_name:
          type: string
          title: Agent Name
        agent_icon:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Icon
        runs_completed:
          type: integer
          title: Runs Completed
        runs_failed:
          type: integer
          title: Runs Failed
        success_rate:
          type: number
          title: Success Rate
      type: object
      required:
      - agent_id
      - agent_name
      - runs_completed
      - runs_failed
      - success_rate
      title: AgentStats
    UserKBStats:
      properties:
        user_id:
          type: string
          title: User Id
        user_name:
          type: string
          title: User Name
        email:
          type: string
          title: Email
        company_knowledge_added:
          type: integer
          title: Company Knowledge Added
        workflows_discovered:
          type: integer
          title: Workflows Discovered
        draft_workflows_created:
          type: integer
          title: Draft Workflows Created
        kb_edits:
          type: integer
          title: Kb Edits
        total_contributions:
          type: integer
          title: Total Contributions
      type: object
      required:
      - user_id
      - user_name
      - email
      - company_knowledge_added
      - workflows_discovered
      - draft_workflows_created
      - kb_edits
      - total_contributions
      title: UserKBStats
    MonthlyCount:
      properties:
        month:
          type: string
          title: Month
        count:
          type: integer
          title: Count
      type: object
      required:
      - month
      - count
      title: MonthlyCount
    WorkflowStats:
      properties:
        workflow_id:
          type: string
          title: Workflow Id
        name:
          type: string
          title: Name
        run_count:
          type: integer
          title: Run Count
      type: object
      required:
      - workflow_id
      - name
      - run_count
      title: WorkflowStats
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
