            schema:
              $ref: '#/components/schemas/GuestInviteRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/customers/{customer_id}/guests/{user_id}:
    patch:
      tags:
      - customers
      summary: Update Customer Guest
      description: 'Edit an accepted guest''s agent allowlist and access expiry.


        Replaces both settings on the ``customer_guests`` grant. Setting a future

        ``expires_at`` on an expired guest re-grants their access (the grant row is

        never deleted on expiry — access is blocked at read time, so it simply

        becomes live again).'
      operationId: update_customer_guest_api_v1_customers__customer_id__guests__user_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Customer Id
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - customers
      summary: Remove Customer Guest
      description: 'Revoke an accepted guest''s access to this customer.


        Removes the customer grant. ``is_guest`` is never cleared (no path to a

        silent privilege gain). When this was the guest''s **last** grant in the org,

        we also remove them from the org entirely — drop their Clerk membership and

        unlink them locally (``organization_id=None``) — so they can no longer sign

        in and use chat / their own connectors with no customer access. Their Clerk

        account survives, so the same email can be re-invited later.'
      operationId: remove_customer_guest_api_v1_customers__customer_id__guests__user_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Customer Id
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/customers/{customer_id}/guests/invitations/{invitation_id}:
    delete:
      tags:
      - customers
      summary: Revoke Customer Guest Invitation
      description: 'Revoke a pending guest invitation.


        Also revokes the underlying Clerk invitation so the recipient can''t accept

        it later and join the org as a full member (which would happen if no

        pending guest invitation remained to flag them on join).'
      operationId: revoke_customer_guest_invitation_api_v1_customers__customer_id__guests_invitations__invitation_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Customer Id
      - name: invitation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Invitation Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
