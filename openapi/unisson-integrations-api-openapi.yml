components:
  schemas:
    ImportMiraklKeysRequest:
      properties:
        items:
          items: {}
          type: array
          minItems: 1
          title: Items
      type: object
      required:
      - items
      title: ImportMiraklKeysRequest
      description: 'Body for the Mirakl bulk key-import endpoint.


        Each item is ``{instance_url, persona, api_key, label?}`` — Mirakl is

        self-hosted per customer (so the base URL is part of the credential) and a

        key acts as one persona (operator | seller). Items are validated per-row

        downstream so one malformed row surfaces as a per-item failure instead of

        rejecting the whole batch — hence the permissive element type.'
    PylonConnectRequest:
      properties:
        api_token:
          type: string
          title: Api Token
        webhook_secret:
          type: string
          title: Webhook Secret
      type: object
      required:
      - api_token
      - webhook_secret
      title: PylonConnectRequest
    MessagingPairRequest:
      properties:
        user_id:
          type: string
          title: User Id
        channel:
          type: string
          pattern: ^(whatsapp|email)$
          title: Channel
        identifier:
          type: string
          title: Identifier
      type: object
      required:
      - user_id
      - channel
      - identifier
      title: MessagingPairRequest
    SlackNotificationConfigBody:
      properties:
        channel_id:
          type: string
          maxLength: 32
          minLength: 1
          title: Channel Id
        channel_name:
          type: string
          maxLength: 80
          minLength: 1
          title: Channel Name
      type: object
      required:
      - channel_id
      - channel_name
      title: SlackNotificationConfigBody
    GitHubRepository:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        full_name:
          type: string
          title: Full Name
        private:
          type: boolean
          title: Private
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        url:
          type: string
          title: Url
      type: object
      required:
      - id
      - name
      - full_name
      - private
      - description
      - url
      title: GitHubRepository
    GranolaCredentialRequest:
      properties:
        api_key:
          type: string
          maxLength: 4096
          minLength: 1
          title: Api Key
      type: object
      required:
      - api_key
      title: GranolaCredentialRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    AssignUserKeyRequest:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        key_id:
          type: string
          format: uuid
          title: Key Id
      type: object
      required:
      - user_id
      - key_id
      title: AssignUserKeyRequest
      description: Body for the per-provider ``…/accounts/{id}/assignments`` endpoints.
    ImportApiKeysRequest:
      properties:
        keys:
          items:
            type: string
          type: array
          minItems: 1
          title: Keys
        labels:
          items:
            type: string
          type: array
          title: Labels
      type: object
      required:
      - keys
      title: ImportApiKeysRequest
      description: 'Body for the Samsara/Snyk/Checkout bulk key-import endpoints.


        ``keys`` and ``labels`` are positionally aligned (``labels`` may be shorter

        than ``keys``; missing positions default to the provider''s own name).

        Blank ``keys`` entries are dropped downstream, so a list of only blanks is

        accepted here and yields an empty per-key result rather than an error.'
    IntegrationStatus:
      properties:
        provider:
          type: string
          title: Provider
        connected:
          type: boolean
          title: Connected
        needs_reconnect:
          type: boolean
          title: Needs Reconnect
          default: false
        connected_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Connected At
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
      type: object
      required:
      - provider
      - connected
      title: IntegrationStatus
    DriveFile:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        mime_type:
          type: string
          title: Mime Type
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
        modified_time:
          anyOf:
          - type: string
          - type: 'null'
          title: Modified Time
        created_time:
          anyOf:
          - type: string
          - type: 'null'
          title: Created Time
      type: object
      required:
      - id
      - name
      - mime_type
      - description
      - url
      - modified_time
      - created_time
      title: DriveFile
    ImportRazorpayKeysRequest:
      properties:
        items:
          items: {}
          type: array
          minItems: 1
          title: Items
      type: object
      required:
      - items
      title: ImportRazorpayKeysRequest
      description: 'Body for the Razorpay bulk key-pair import endpoint.


        Each item is ``{key_id, key_secret, display_name, label?}``. Items are

        validated per-row downstream so one malformed row surfaces as a per-item

        failure instead of rejecting the whole batch — hence the permissive element

        type; only the non-empty envelope is enforced here.'
    GrafanaDashboardListItem:
      properties:
        uid:
          type: string
          title: Uid
        title:
          type: string
          title: Title
        url:
          type: string
          title: Url
          default: ''
      type: object
      required:
      - uid
      - title
      title: GrafanaDashboardListItem
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
