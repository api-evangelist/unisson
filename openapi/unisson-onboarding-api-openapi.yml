openapi: 3.2.0
info:
  title: Unisson Onboarding API
  version: 1.0.0
tags:
- name: Onboarding
paths:
  /api/v1/onboarding/status:
    get:
      tags:
      - Onboarding
      summary: Get Onboarding Status
      description: Get current onboarding status for the user's organization.
      operationId: get_onboarding_status_api_v1_onboarding_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingStatusResponse'
      security:
      - HTTPBearer: []
  /api/v1/onboarding/complete:
    post:
      tags:
      - Onboarding
      summary: Complete Onboarding
      description: Mark onboarding as complete and save organization settings.
      operationId: complete_onboarding_api_v1_onboarding_complete_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteOnboardingRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteOnboardingResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    OnboardingStatusResponse:
      properties:
        completed:
          type: boolean
          title: Completed
      type: object
      required:
      - completed
      title: OnboardingStatusResponse
    CompleteOnboardingResponse:
      properties:
        success:
          type: boolean
          title: Success
      type: object
      required:
      - success
      title: CompleteOnboardingResponse
    CompleteOnboardingRequest:
      properties:
        start_url:
          type: string
          title: Start Url
        allowed_domains:
          items:
            type: string
          type: array
          title: Allowed Domains
      type: object
      required:
      - start_url
      - allowed_domains
      title: CompleteOnboardingRequest
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
